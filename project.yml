name: HackathonApp
options:
  bundleIdPrefix: dev.hackathon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HackathonApp:
    type: application
    platform: iOS
    sources: [MyApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hackathon.HackathonApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  HackathonAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HackathonApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hackathon.HackathonAppTests
schemes:
  HackathonApp:
    build:
      targets:
        HackathonApp: all
        HackathonAppTests: [test]
    test:
      targets: [HackathonAppTests]
